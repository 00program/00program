<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ps4 trace mode</title>
<style>
  html,body{margin:0;background:#0b0d10;color:#c8ced8;font:14px/1.45 monospace;}
  #wrap{padding:16px;}
  #state{font-size:22px;font-weight:700;margin:0 0 10px;}
  #out{white-space:pre-wrap;background:#11151b;border:1px solid #1e2732;
       border-radius:5px;padding:10px 12px;height:calc(100vh - 100px);
       overflow-y:auto;}
  .ok{color:#7fd0a0;} .bad{color:#d08a7f;} .warn{color:#d8c07f;}
</style>
</head>
<body>
<div id="wrap">
  <div id="state">trace mode</div>
  <div id="out"></div>
</div>
<script type="module">
import { establishPrimitive } from "./core.js?v=trace1";

const outEl = document.getElementById("out");
const stateEl = document.getElementById("state");
const lines = [];
function log(t, d) {
    const s = t + (d ? "  " + d : "");
    lines.push(s);
    outEl.textContent = lines.join("\n");
    outEl.scrollTop = outEl.scrollHeight;
    try {
        const x = new XMLHttpRequest();
        x.open("POST", "t", true);
        x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
        x.send("TRACE&tag=" + encodeURIComponent(t) + "&detail=" + encodeURIComponent(d||""));
    } catch(e){}
}
function state(t,c){ stateEl.textContent=t; stateEl.className=c||""; }

(async function(){
    try {
        state("STEP 0: before anything");
        log("TRACE-START", "navigator.onLine=" + navigator.onLine
            + " heap=" + (performance.memory
                ? (performance.memory.usedJSHeapSize/0x100000).toFixed(1) + "MB"
                : "?"));

        state("STEP 1: establishing primitive...");
        log("TRACE-1-BEFORE", "calling establishPrimitive");
        await new Promise(r => setTimeout(r, 500)); // dar tiempo al log

        const carrier = await establishPrimitive({
            maxAttempts: 3,
            onEvent: function(tag, detail, attempt) {
                log("PRIM:" + tag, (attempt != null ? "["+attempt+"] " : "") + (detail || ""));
            }
        });

        log("TRACE-1-AFTER", "carrier established");
        state("STEP 1 OK", "ok");
        await new Promise(r => setTimeout(r, 500));

        // Probar la primitiva
        state("STEP 2: testing primitive");
        log("TRACE-2-A", "carrier.view length=" + carrier.view.length);
        log("TRACE-2-B", "carrier.hostAddress=" + carrier.hostAddress);
        log("TRACE-2-C", "carrier.fakeAddress=" + carrier.fakeAddress);

        // aim al propio host y leer los primeros bytes
        log("TRACE-2-D", "calling carrier.aim");
        carrier.aim(carrier.hostAddress);
        log("TRACE-2-E", "aim OK, first 16 bytes: "
            + Array.from(carrier.view.slice(0,16)).map(b=>b.toString(16).padStart(2,"0")).join(" "));
        log("TRACE-2-F", "calling carrier.restore");
        carrier.restore();
        log("TRACE-2-G", "restore OK");
        state("STEP 2 OK", "ok");
        await new Promise(r => setTimeout(r, 500));

        // Esperar 3 segundos sin hacer nada para ver si la consola aguanta
        state("STEP 3: idle 3s", "warn");
        log("TRACE-3-IDLE", "waiting 3s to see if console survives");
        for (let i = 0; i < 6; i++) {
            await new Promise(r => setTimeout(r, 500));
            log("TRACE-3-TICK", "t=" + ((i+1)*500) + "ms heap="
                + (performance.memory
                    ? (performance.memory.usedJSHeapSize/0x100000).toFixed(1) + "MB"
                    : "?"));
        }

        state("DONE - SURVIVED", "ok");
        log("TRACE-DONE", "console survived the primitive test. "
            + "The crash is somewhere AFTER this point -- mem.js promote "
            + "or the workers, not core.js.");
    } catch (e) {
        log("TRACE-THREW", (e && e.message) ? e.message : String(e));
        log("TRACE-STACK", e && e.stack ? String(e.stack).slice(0,300) : "");
        state("FAILED - see log", "bad");
    }
})();
</script>
</body>
</html>
